<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#10151c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TGmusic" id="app-title-meta">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-180.png">
    <title>TGmusic</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512.png">
    <!--
        字体策略：原方案从 Google Fonts 拉 Noto Sans SC 三个字重 + Playfair Display。
        中文（CJK）字体单字重就 2-8MB，且 Playfair Display 全站零使用，
        移动网络下会把首屏拖到十几秒。改用系统字体栈，零请求、零 FOIT。
    -->
    <link rel="stylesheet" href="/assets/css/tailwind.css">
    <link rel="stylesheet" href="/assets/css/APlayer.min.css">
    <style>
        :root {
            --dynamic-accent: #d97706; --solara-text: #1e293b; --glass-blur: blur(40px);
            --main-glass: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
            --inner-glass: rgba(255, 255, 255, 0.15); --glass-border: rgba(255, 255, 255, 0.25);
            --btn-icon-color: #ffffff;
            /* 移动端主题：由 updateBackground() 按当前配色写入 */
            --m-deep: #0f2e22; --m-deep-2: #06120d; --m-accent: #34d399;
            --m-glow: rgba(52, 211, 153, 0.35);
        }

        /* 首屏底色用中性深色：updateBackground() 跑起来前不会白屏闪烁。
           注意这里只能用 background-color，不能用 background 简写，否则会覆盖后面的主题设置。 */
        body { color: var(--solara-text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Source Han Sans SC', 'Noto Sans CJK SC', sans-serif; height: 100vh; height: 100dvh; margin: 0; overflow: hidden; background-color: #10151c; transition: background-color 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        #bg-stage { position: fixed; inset: 0; z-index: -2; transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        #bg-overlay { position: fixed; inset: 0; z-index: -1; opacity: 0; transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; }

        @media (min-width: 769px) {
            /* 桌面端是浅色玻璃拟态，首屏底色跟着走，避免加载时闪一下深色 */
            body { background-color: #eef2f7; }
        }
        .desktop-container { 
            width: 96%; max-width: 1350px; height: 82vh; 
            max-height: calc(100dvh - 24px); min-height: 0; 
            background: var(--main-glass); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 24px; 
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.1); 
            display: flex; flex-direction: column; padding: clamp(14px, 2.5vh, 24px) clamp(16px, 3vw, 44px); gap: 16px; 
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); 
            justify-content: space-between; transition: all 1.2s ease; 
        }
        .desktop-container > * { flex-shrink: 0; }
        .desktop-container .content-layout { flex-shrink: 1; }

        .settings-corner { position: absolute; right: 32px; top: 25px; z-index: 200; display: flex; align-items: center; justify-content: center; }
        .brand-title { font-size: clamp(2rem, 5vw, 3rem); font-weight: 900; color: white; text-align: center; }
        .brand-sub { font-size: 0.85rem; font-weight: 700; color: rgba(255,255,255,0.6); text-align: center; margin-top: 12px; font-style: italic; }

        .search-panel { background: rgba(255, 255, 255, 0.15); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.2); padding: clamp(12px, 2vh, 20px) clamp(14px, 3vw, 36px); display: flex; gap: 16px; align-items: center; }
        .search-capsule { flex: 1; height: 44px; background: rgba(255, 255, 255, 0.25); border-radius: 12px; display: flex; align-items: center; border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(15px); padding-right: 12px; }
        .search-input-field { flex: 1; background: transparent; border: 0; outline: none; padding: 0 16px; font-weight: 700; font-size: 1.15rem; color: #1e293b; }
        .search-input-field::placeholder { font-size: 0.9rem; font-weight: 400; color: rgba(30, 41, 59, 0.35); }
        .search-confirm-btn { background: var(--dynamic-accent); color: white; padding: 0 32px; height: 44px; border-radius: 12px; font-weight: 900; box-shadow: 0 10px 25px rgba(0,0,0,0.15); transition: 0.3s; }
        .clear-search-icon { width: 24px; height: 24px; display: grid; place-items: center; opacity: 0.3; cursor: pointer; transition: 0.2s; color: #1e293b; }
        .clear-search-icon:hover { opacity: 0.8; }

        .content-layout { flex: 1 1 0%; min-height: 0; display: grid; grid-template-columns: minmax(0, 0.65fr) minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 24px; overflow: hidden; margin: 10px 0; max-height: 55%; }
        .panel-box { background: var(--inner-glass); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.2); display: flex; flex-direction: column; overflow: hidden; }
        
        .song-item { padding: 12px 16px; margin: 3px 8px; border-radius: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; position: relative; padding-right: 110px; }
        .song-item.active { background: rgba(255, 255, 255, 0.3); color: var(--dynamic-accent); font-weight: 900; }
        .song-item:hover:not(.active) { background: rgba(255, 255, 255, 0.15); }
        .song-title-text { font-size: 13px !important; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist-text { font-size: 11px !important; opacity: 0.5; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-actions { position: absolute; right: 12px; display: flex; gap: 8px; opacity: 0; transition: 0.2s; pointer-events: auto; }
        .song-item:hover .song-actions { opacity: 1; }
        .action-btn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: rgba(255,255,255,0.15); color: inherit; transition: 0.2s; }
        .action-btn:hover { background: var(--dynamic-accent); color: white !important; transform: scale(1.1); }
        .action-btn.is-fav { color: #ef4444 !important; }
        .action-btn.is-fav:hover { background: rgba(239, 68, 68, 0.15); color: #ef4444 !important; }

        .lyrics-panel { flex: 1; height: 100%; width: 100%; mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent); overflow-y: auto; scroll-behavior: smooth; text-align: center; display: flex; flex-direction: column; align-items: center; position: relative; background: transparent !important; padding-top: 45%; padding-bottom: 45%; }
        .lrc-line { display: block; width: 90%; padding: 10px 14px; font-size: 14px; font-weight: 600; color: #475569; transition: all 0.4s ease; flex-shrink: 0; opacity: 0.5; }
        .lrc-line.active { color: var(--dynamic-accent); background: rgba(255, 255, 255, 0.25); border-radius: 10px; font-weight: 900; opacity: 1; backdrop-filter: blur(10px); transform: scale(1.1); }

        .footer-bar { height: 90px; background: transparent; display: flex; align-items: center; padding: 0 10px; gap: 24px; margin-top: auto; }
        .btn-round { width: 44px; height: 44px; border-radius: 50%; background: var(--dynamic-accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: background 0.3s; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15); color: var(--btn-icon-color); border: 0 !important; overflow: hidden; }
        @media (hover: hover) { .btn-round:not(.m-header *):hover { transform: translateY(-3px); } }
        .btn-main { width: 56px !important; height: 56px !important; }

        .scrubber-area { flex: 1; display: flex; align-items: center; gap: 16px; margin: 0 20px; }
        /* 物理级根治点1：移除溢出隐藏，确保圆点白框不再被截断 */
        .rail { flex: 1; height: 6px; background: rgba(0, 0, 0, 0.08); border-radius: 10px; position: relative; cursor: pointer; overflow: visible !important; }
        .fill { height: 100%; background: var(--dynamic-accent); border-radius: 10px; width: 0%; position: relative; z-index: 5; transition: width 0.1s linear; }
        .buffer-fill { height: 100%; background: rgba(255, 255, 255, 0.35); border-radius: 10px; width: 0%; position: absolute; left: 0; top: 0; z-index: 2; transition: width 0.4s ease; }
        
        /* 播放进度圆点精修：仅保留核心实心与单层锐利白边 */
        .dot { 
            position: absolute; right: -8px; top: 50%; transform: translateY(-50%); 
            width: 16px; height: 16px; 
            background: var(--dynamic-accent); 
            border: 2px solid white; 
            border-radius: 50%; 
            cursor: grab; z-index: 100 !important; 
            transition: transform 0.2s;
        }
        .dot:hover { transform: translateY(-50%) scale(1.15); }
        
        .volume-control { width: 150px; display: flex; align-items: center; gap: 12px; }
        .volume-rail { flex: 1; height: 4px; background: rgba(0, 0, 0, 0.08); border-radius: 10px; position: relative; cursor: pointer; overflow: visible !important; }

        .cover-container { 
            width: min(14rem, 30vh); height: min(14rem, 30vh); border-radius: 1.5rem; overflow: hidden; margin-bottom: 0.75rem; 
            box-shadow: 0 15px 45px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.2); 
            display: flex; align-items: center; justify-content: center; position: relative; 
            background: rgba(255,255,255,0.08); backdrop-filter: blur(30px);
        }
        .cover-img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1); z-index: 10; position: absolute; inset: 0; }
        .cover-placeholder { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; flex-direction: column; overflow: hidden; background: linear-gradient(135deg, rgba(255,255,255,0.38) 0%, rgba(255,255,255,0.08) 55%, rgba(255,255,255,0.22) 100%); backdrop-filter: blur(30px) saturate(1.4); -webkit-backdrop-filter: blur(30px) saturate(1.4); border: 1px solid rgba(255,255,255,0.35); box-shadow: inset 0 1px 0 rgba(255,255,255,0.45); transition: background 0.6s ease; }
        .cover-placeholder svg { fill: var(--dynamic-accent); opacity: 0.7; }

        .mobile-player-container {
            display: none; position: fixed; inset: 0; z-index: 100; flex-direction: column;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 10px;
            /* 主题底色。顶部 18% 保持纯 --m-deep，与 theme-color（状态栏）完全同色，
               否则状态栏和内容之间会有一条色带。光晕下移到唱片区域才开始渐亮。 */
            background:
                linear-gradient(180deg, var(--m-deep) 0%, var(--m-deep) 18%, transparent 42%),
                radial-gradient(115% 62% at 50% 46%, var(--m-glow) 0%, transparent 60%),
                radial-gradient(85% 45% at 50% 100%, var(--m-glow) 0%, transparent 65%),
                linear-gradient(165deg, var(--m-deep) 0%, var(--m-deep-2) 100%);
            background-color: var(--m-deep);
            transition: background 0.9s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .m-header { height: 50px; width: 100%; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; background: transparent; border: 0; }
        .m-header .btn-round { background: transparent !important; border: 0 !important; box-shadow: none !important; width: 44px; height: 44px; color: white !important; z-index: 210; }

        .m-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; width: 100%; padding: 45px 0 0 0; }
        .m-controls-capsule { background: transparent; border: 0; padding: 0 15px 45px 15px; width: 100%; flex-shrink: 0; }
        #m-scrubber-wrap { position: relative; height: 32px; display: flex; align-items: center; cursor: pointer; touch-action: none; margin-bottom: -4px; z-index: 10; }
        #m-scrubber-wrap .rail { width: 100%; height: 4px; border-radius: 10px; }
        /* 移动端进度条用主题色，和按钮呼应 */
        #m-prog-bar.fill { background: var(--m-accent) !important; box-shadow: 0 0 12px var(--m-glow); }
        #m-prog-bar .dot { background: #fff !important; box-shadow: 0 0 10px var(--m-glow) !important; }

        @keyframes disc-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .m-disc-container { width: 72vw; max-width: 280px; aspect-ratio: 1/1; position: relative; flex-shrink: 0; background: transparent !important; border-radius: 50% !important; isolation: isolate; margin: 0px 0; }
        .m-disc-shadow-layer { position: absolute; inset: -45px; border-radius: 50%; background: radial-gradient(circle at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.15) 45%, transparent 72%); z-index: 0; pointer-events: none; }
        .m-disc-clipping { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50% !important; overflow: hidden !important; border: 6px solid rgba(255,255,255,0.14); clip-path: circle(50% at 50% 50%); -webkit-mask-image: -webkit-radial-gradient(white, black); z-index: 5; animation: disc-rotate 25s linear infinite; animation-play-state: paused; }
        /* 唱片外圈光晕：跟随主题强调色，播放时更亮 */
        .m-disc-container::after { content: ''; position: absolute; inset: -14px; border-radius: 50%; pointer-events: none; z-index: 4; box-shadow: 0 0 0 1px var(--m-glow), 0 0 46px var(--m-glow); opacity: 0.55; transition: opacity 0.6s ease, box-shadow 0.6s ease; }
        .m-disc-container.playing::after { opacity: 1; box-shadow: 0 0 0 1px var(--m-glow), 0 0 70px var(--m-glow); }
        .m-disc-container.playing .m-disc-clipping { animation-play-state: running; }
        .m-disc-clipping img { width: 100%; height: 100%; object-fit: cover; border-radius: 50% !important; }

        .m-lyrics-panel { flex: 1; width: 100%; height: auto !important; position: relative; display: flex; flex-direction: column; align-items: center; overflow-y: auto; scroll-behavior: smooth; mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 75%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 75%, transparent 100%); pointer-events: none; background: transparent !important; margin-bottom: 0px; margin-top: 10px; }
        .m-lyrics-panel::-webkit-scrollbar { display: none; }
        .m-lyrics-panel .lrc-line { background: transparent !important; text-align: center; color: white; opacity: 0.3; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); border: 0 !important; padding: 6px 10px; font-size: 14px; width: 90%; transform: scale(0.95); flex-shrink: 0; transform-origin: center; }
        .m-lyrics-panel .lrc-line.active { display: block !important; font-size: 1.15rem; opacity: 1; font-weight: 900; transform: scale(1.08); color: #fff; text-shadow: 0 0 22px var(--m-glow), 0 2px 10px rgba(0,0,0,0.45); }

        .m-info-wrap { width: 100%; text-align: center; color: white; flex-shrink: 0; height: 60px; margin-top: 0; margin-bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
        .m-song-title { font-size: 1.25rem; font-weight: 900; letter-spacing: 0.03em; margin-bottom: 0px; text-shadow: 0 2px 14px rgba(0,0,0,0.4); }
        .m-artist-row { display: flex; align-items: center; justify-content: center; gap: 8px; opacity: 0.62; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.1em; }
        
        .m-controls { width: 100%; flex-shrink: 0; }
        .m-time-row { display: flex; justify-content: space-between; width: 100%; padding: 8px 2px 0 2px; margin-top: -4px; }
        .m-time-text { font-size: 10px; font-weight: 900; opacity: 0.5; color: white; }
        
        .m-btn-row { display: flex; align-items: center; justify-content: space-between; width: 100%; padding-top: 15px; }
        .m-btn-row .btn-round { width: 50px; height: 50px; background: white !important; color: var(--m-accent) !important; box-shadow: 0 8px 26px rgba(0, 0, 0, 0.28); border: 0 !important; display: grid; place-items: center; flex-shrink: 0; transition: transform 0.15s ease, box-shadow 0.25s ease; }
        .m-btn-row .btn-round:active { transform: scale(0.92); }
        /* 手写主题色类：tailwind.css 是预编译的，`!text-[var(--m-accent)]` 这类
           任意值类名不会被编译进去，必须在这里自己定义。 */
        .m-icon-accent { color: var(--m-accent) !important; }
        .m-prog-dot { background: #fff !important; }
        .bg-[var(--m-accent)] hover:brightness-110 { background: var(--m-accent); }
        .bg-[var(--m-accent)] hover:brightness-110:hover { filter: brightness(1.1); }
        /* tailwind 无法对 CSS 变量做 /50 透明度运算，这条手写 */
        .dialog-focus-accent:focus { border-color: var(--m-glow); }
        .m-btn-row .btn-main { box-shadow: 0 10px 34px var(--m-glow), 0 6px 18px rgba(0,0,0,0.3); }
        .m-btn-row .btn-main { width: 68px !important; height: 68px !important; }

        #m-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 999; display: none; }
        .m-drawer { position: fixed; bottom: -100%; left: 0; width: 100%; height: 80vh; background: linear-gradient(170deg, var(--m-deep) 0%, var(--m-deep-2) 100%); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); z-index: 1000; border-radius: 32px 32px 0 0; transition: 0.45s cubic-bezier(0.19, 1, 0.22, 1); display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.08); }
        .m-drawer.active { bottom: 0; }
        
        #m-pl-cards { display: flex; gap: 0px; overflow-x: auto; padding: 15px 20px 0 20px; flex-shrink: 0; border-bottom: 1.5px solid rgba(255, 255, 255, 0.1); }
        #m-pl-cards::-webkit-scrollbar { display: none; }
        
        .m-pl-card { 
            flex-shrink: 0; height: 34px; min-width: 65px; padding: 0 16px; 
            border-radius: 10px 10px 0 0; background: rgba(255, 255, 255, 0.06); 
            border: 1px solid rgba(255, 255, 255, 0.1); border-bottom: none; 
            display: flex; align-items: center; justify-content: center; 
            margin-right: 3px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: white !important; font-size: 11px; font-weight: 700;
        }
        .m-pl-card.active { 
            background: rgba(255, 255, 255, 0.18) !important; 
            border-color: rgba(255, 255, 255, 0.25) !important; 
            transform: translateY(1.5px); 
            z-index: 10; font-weight: 900;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .m-list-search-wrap { padding: 12px 20px 10px 20px; flex-shrink: 0; display: flex; align-items: center; position: relative; }
        .m-list-search-box { width: 100%; height: 46px; background: rgba(255, 255, 255, 0.08); border: 1.5px solid rgba(255, 255, 255, 0.15); border-radius: 16px; padding: 0 45px 0 20px; color: white; font-size: 14px; font-weight: 700; outline: none; }
        .m-list-search-box::placeholder { font-size: 12px; font-weight: 400; opacity: 0.55; }
        .m-clear-search { position: absolute; right: 35px; color: white; opacity: 0.5; cursor: pointer; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(20px); z-index: 2000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .sarah-dialog-overlay.active { display: flex !important; }
        
        #admin-box { width: 92%; max-width: 900px; height: 85vh; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(60px); border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 50px 100px rgba(0, 0, 0, 0.3); outline: none !important; }
        .admin-header { padding: 10px 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; min-height: 70px; }
        .admin-header-center { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 0 20px; flex-shrink: 0; }
        .admin-console-box { background: rgba(255, 255, 255, 0.05); border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 20px; width: auto; max-width: 100%; }

        .admin-action-bar { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .admin-btn-icon { width: 38px; height: 38px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.1); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.15); transition: 0.25s; cursor: pointer; color: white; backdrop-filter: brightness(1.1); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); padding: 0 !important; }
        .admin-btn-icon:hover { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.3); transform: scale(1.05); }
        .admin-btn-icon:active { transform: scale(0.92); }
        .admin-btn-icon svg { width: 18px; height: 18px; display: block; margin: auto; }

        @media (max-width: 768px) { 
            .admin-btn-icon:hover { transform: none !important; } 
            /* 物理级根治点3：移动端操作按钮常显，防止位移误触 */
            .song-item .song-actions { opacity: 1 !important; pointer-events: auto !important; }
        }

        #admin-header-center { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 0 20px; flex-shrink: 0; }
        .admin-console-box { background: rgba(255, 255, 255, 0.05); border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 20px; width: auto; max-width: 100%; }

        .admin-content { flex: 1; overflow-y: auto; padding: 8px 20px; }
        
        .admin-tabs-nav { display: flex; align-items: flex-end; gap: 4px; overflow-x: auto; margin-bottom: 5px; padding: 0 5px; }
        .admin-tabs-nav::-webkit-scrollbar { display: none; }
        .browser-tab {
            min-width: 70px; max-width: 140px; height: 36px; padding: 0 10px;
            background: rgba(255, 255, 255, 0.05); border-radius: 10px 10px 0 0;
            display: flex; align-items: center; justify-content: center; cursor: grab;
            border: 1px solid rgba(255, 255, 255, 0.1); border-bottom: none;
            transition: transform 0.2s, opacity 0.2s; position: relative; flex-shrink: 0;
        }
        .browser-tab.active { background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.2); z-index: 10; }
        .browser-tab.active .browser-tab-text { opacity: 1; color: #10b981; }
        .browser-tab-text { font-size: 11px; font-weight: 900; color: white; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; pointer-events: none; }
        .browser-tab-close { position: absolute; top: 1px; right: 1px; width: 14px; height: 14px; border-radius: 4px; display: grid; place-items: center; opacity: 0.8; transition: 0.2s; color: white; flex-shrink: 0; background: rgba(255, 255, 255, 0.08); }
        .browser-tab-close:hover { opacity: 1 !important; background: rgba(255, 255, 255, 0.2); }
        
        .browser-tab-arrow { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); display: flex; gap: 3px; opacity: 0; transition: 0.3s; pointer-events: none; }
        .browser-tab:hover .browser-tab-arrow { opacity: 1; pointer-events: auto; }
        .browser-tab-arrow span { color: white; font-size: 10px; font-weight: 900; cursor: pointer; padding: 2px 8px; background: #10b981; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 6px; backdrop-filter: blur(10px); line-height: 1.1; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); }
        .browser-tab-arrow span:hover { background: #059669; transform: scale(1.1); }
        
        @media (max-width: 768px) { .browser-tab-arrow { display: none !important; } }

        .browser-tab-add { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.08); color: white; cursor: pointer; flex: none; flex-shrink: 0; margin-left: 10px; transition: 0.2s; aspect-ratio: 1/1; overflow: hidden; }
        .browser-tab-add:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.1); }
        .browser-tab.is-dragging { position: fixed !important; pointer-events: none !important; opacity: 0.8 !important; z-index: 10000 !important; background: rgba(255, 255, 255, 0.2) !important; border: 1px solid rgba(255, 255, 255, 0.3) !important; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5) !important; transform: scale(1.05); }
        .browser-tab.is-hidden { visibility: hidden !important; }

        .admin-song-row {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05); border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 8px; transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); position: relative; will-change: transform;
            cursor: grab;
        }
        .admin-song-row:hover { background: rgba(255, 255, 255, 0.1); }
        .admin-song-row.editing { background: rgba(0, 0, 0, 0.3); border: 2px solid var(--dynamic-accent); cursor: default; transform: none !important; position: relative !important; z-index: 100; width: 100%; }
        .admin-song-row.is-dragging { 
            position: fixed !important; pointer-events: none !important; opacity: 0.85 !important; 
            border: 2px solid var(--dynamic-accent) !important; background: rgba(0, 0, 0, 0.7) !important; 
            z-index: 10000 !important; box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6) !important; 
            transition: none !important; transform: scale(1.03); 
        }
        .admin-song-placeholder { height: 64px; border: 2px dashed rgba(255, 255, 255, 0.25); border-radius: 14px; margin-bottom: 8px; background: rgba(255, 255, 255, 0.03); transition: none; }
        .admin-song-row.is-hidden { visibility: hidden !important; height: 0 !important; margin: 0 !important; padding: 0 !important; border: 0 !important; overflow: hidden; }
        .admin-song-info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; pointer-events: none; }
        .admin-song-input { background: transparent; border: none; outline: none; color: white; font-weight: 700; width: 100%; padding: 2px 6px; border-radius: 6px; transition: 0.2s; cursor: inherit; }
        .admin-song-title-input { font-size: 14px; }
        .admin-song-artist-input { font-size: 11px; opacity: 0.5; }
        .admin-song-row.editing .admin-song-info { pointer-events: auto; }
        .admin-song-row.editing .admin-song-input { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.2); cursor: text; }
        
        .admin-action-group { display: flex; align-items: center; gap: 6px; }
        .admin-action-btn { width: 32px !important; height: 32px !important; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.1); color: white; transition: 0.2s; cursor: pointer; padding: 0 !important; }
        .admin-action-btn:hover { background: var(--dynamic-accent); transform: scale(1.05); }
        .admin-action-btn.delete:hover { background: #ef4444; }
        .admin-action-btn svg { width: 16px; height: 16px; }

        @media (max-width: 768px) { .admin-action-btn:hover { transform: none !important; } }

        .upload-preview-item { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; background: rgba(255, 255, 255, 0.05); border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.1); animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .preview-main-row { display: flex; align-items: center; gap: 12px; width: 100%; }
        .preview-prog-container { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.08); border-radius: 10px; overflow: hidden; }
        .preview-prog-fill { height: 100%; background: #10b981; width: 0%; transition: width 0.2s ease; }
        .preview-percent-text { font-size: 10px; font-weight: 900; color: #10b981; opacity: 0; transition: 0.3s; }
        .preview-status-dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; flex-shrink: 0; }
        .preview-status-dot.uploading { background: #eab308; box-shadow: 0 0 10px #eab308; animation: pulse 1.5s infinite; }
        .preview-status-dot.success { background: #10b981; }
        .preview-status-dot.error { background: #ef4444; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        .upload-card { position: relative; padding: 12px 25px !important; background: rgba(255, 255, 255, 0.04); border: 2px dashed rgba(255, 255, 255, 0.2); border-radius: 18px; text-align: center; transition: 0.4s; cursor: pointer; overflow: hidden; display: flex; align-items: center; gap: 15px; }
        .upload-card:hover { border-color: var(--dynamic-accent); background: rgba(255, 255, 255, 0.1); }
        .upload-hint { display: flex; align-items: center; gap: 12px; cursor: pointer; width: 100%; }
        .upload-hint svg { opacity: 0.85; color: #10b981; width: 28px; height: 28px; }
        .upload-hint span { font-size: 11px; font-weight: 900; color: white; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px; }

        @media (max-width: 768px) { 
            #admin-box { width: 90% !important; max-width: 440px; background: linear-gradient(170deg, var(--m-deep) 0%, var(--m-deep-2) 100%) !important; border-radius: 30px; height: 85vh; } 
            .admin-header { padding: 12px 15px; flex-direction: row; justify-content: space-between; align-items: center; gap: 0; height: auto; min-height: 60px; flex-wrap: wrap; }
            #admin-header-center { flex: none; width: 100%; order: 10; padding: 10px 0; }
            .browser-tab { min-width: 60px; max-width: 100px; padding: 0 8px; cursor: pointer; }
        }

        #msg-box { position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--dynamic-accent); color: white; padding: 15px 50px; border-radius: 100px; font-weight: 900; z-index: 10000; transition: 0.5s; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1); }
        #msg-box.active { transform: translateX(-50%) translateY(0); }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }

        /* 认证层样式 */
        #auth-gate { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .auth-card {
            width: 100%; max-width: 380px; border-radius: 2rem; padding: 4.5rem 3rem 4rem;
            text-align: center; display: flex; flex-direction: column; align-items: center;
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255,255,255,0.15);
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .auth-title {
            font-size: 1.5rem; font-weight: 900; margin-bottom: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
        }
        .auth-subtitle {
            font-size: 0.8rem; font-weight: 500; margin-bottom: 3rem; letter-spacing: 0.06em; opacity: 0.6;
        }
        .auth-input {
            width: 100%; border-radius: 1rem; padding: 1.15rem 1.5rem; font-size: 1.05rem; font-weight: 600;
            outline: none; transition: all 0.3s ease; text-align: center; letter-spacing: 0.2em;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
        }
        .auth-input:focus { border-color: rgba(255, 255, 255, 0.4); transform: scale(1.02); }
        .auth-btn {
            width: 100%; padding: 1.15rem; border-radius: 1rem; font-weight: 800; font-size: 0.85rem;
            letter-spacing: 4px; transition: all 0.3s ease; border: none; cursor: pointer;
            text-transform: uppercase; margin-top: 1.5rem;
        }
        .auth-btn:active { transform: scale(0.96); }
        /* 桌面端主题渐变背景 */
        @media (min-width: 769px) {
            #auth-gate { background: var(--auth-bg, linear-gradient(135deg, #f0fdf4, #064e3b)); }
            .auth-title { color: var(--auth-text, #1e293b); }
            .auth-subtitle { color: var(--auth-text, #1e293b); }
            .auth-input { background: rgba(255, 255, 255, 0.25); color: var(--auth-text, #1e293b); }
            .auth-input::placeholder { color: var(--auth-text-muted, rgba(30,41,59,0.35)); }
            .auth-btn { background: var(--auth-accent, #10b981); color: #fff; box-shadow: 0 12px 30px var(--auth-accent-shadow, rgba(16,185,129,0.3)); }
        }
        /* 手机端主题色背景 */
        @media (max-width: 768px) {
            #auth-gate { background: var(--auth-deep, #064e3b); backdrop-filter: blur(80px); -webkit-backdrop-filter: blur(80px); }
            .auth-title { color: #fff; }
            .auth-subtitle { color: rgba(255,255,255,0.5); }
            .auth-input { background: rgba(255, 255, 255, 0.08); color: #fff; }
            .auth-input::placeholder { color: rgba(255,255,255,0.25); }
            .auth-btn { background: #fff; color: var(--auth-deep, #064e3b); box-shadow: 0 12px 30px rgba(0,0,0,0.15); }
        }

        /* 窗口自适应：中等宽度桌面仅收紧间距与封面，保持三栏布局，歌词始终可见 */
        @media (max-width: 1150px) {
            .desktop-container { padding: 16px 22px; gap: 12px; }
            .content-layout { gap: 16px; }
            .cover-container { width: min(10rem, 26vh); height: min(10rem, 26vh); }
            .volume-control { width: 120px; }
        }
        /* 窗口自适应：矮窗口压缩移动端唱片与间距，避免纵向溢出 */
        @media (max-height: 700px) {
            .m-main { padding-top: 20px; }
            .m-controls-capsule { padding: 0 15px 20px 15px; }
            .m-disc-container { width: min(72vw, 200px, 34vh); }
            .m-info-wrap { height: 46px; }
        }

        /* 移动端触感与滚动：去掉点击高亮、禁止页面橡皮筋、按钮免 300ms 延迟 */
        html, body { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overscroll-behavior: none; }
        button, .btn-round, [onclick] { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
        .mobile-player-container { overscroll-behavior: contain; }
        .m-lyrics-panel { -webkit-overflow-scrolling: touch; }

        @media (max-width: 768px) { .desktop-container { display: none; } .mobile-player-container { display: flex; } }
    </style>
</head>
<body>
    <div id="msg-box"></div>
    <div id="bg-stage"></div>
    <div id="bg-overlay"></div>

    <!-- 访问认证层 -->
    <div id="auth-gate" style="display:none">
        <div class="auth-card">
            <h2 class="auth-title" id="auth-title">TGmusic</h2>
            <p class="auth-subtitle">请输入访问密码以继续</p>
            <input type="password" id="entry-pass" class="auth-input" placeholder="请输入密码" onkeydown="if(event.key==='Enter')verifyAccess()">
            <button onclick="verifyAccess()" class="auth-btn">进入</button>
        </div>
    </div>

    <!-- Sarah Dialog UI -->
    <div id="sarah-dialog" class="sarah-dialog-overlay fixed inset-0 bg-black/60 backdrop-blur-2xl z-[3000] hidden items-center justify-center" onclick="closeSarahDialog()">

            <h4 id="dialog-title" class="text-white font-black text-xl mb-2 text-center tracking-tight">提示</h4>
            <p id="dialog-msg" class="text-white/60 text-xs mb-8 text-center leading-relaxed px-4"></p>
            <div id="dialog-input-wrap" class="hidden mb-8">
                <input id="dialog-input" class="w-full bg-white/5 p-4 rounded-2xl text-white text-sm outline-none border border-white/10 dialog-focus-accent focus:bg-white/10 transition-all shadow-inner" placeholder="请输入...">
            </div>
            <div class="flex gap-3">
                <button id="dialog-cancel" onclick="closeSarahDialog()" class="flex-1 py-4 bg-white/5 text-white/50 hover:text-white hover:bg-white/10 rounded-2xl text-[11px] font-black transition-all active:scale-95">取消</button>
                <button id="dialog-confirm" class="flex-1 py-4 bg-[var(--m-accent)] hover:brightness-110 text-white rounded-2xl text-[11px] font-black shadow-lg transition-all active:scale-95">确认</button>

        </div>

            <button onclick="closePlaylistSelector()" class="w-full mt-6 py-3 bg-white/10 text-white rounded-xl text-xs font-black">取消分发</button>

    <!-- 音频元素宿主：必须留在文档流里（视觉隐藏即可），display:none 会让移动端息屏后挂起播放 -->
    <div id="ap-hidden" style="position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden"></div>
    <script src="/assets/js/APlayer.min.js"></script>
    <script>
        let SITE_TITLE = 'TGmusic';

        function applySiteTitle(name) {
            if (!name) return;
            SITE_TITLE = name;
            const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
            document.title = name;
            set('auth-title', name);
            set('brand-title', name);
            set('m-brand-title', name);
            const meta = document.getElementById('app-title-meta');
            if (meta) meta.setAttribute('content', name);
        }

        (function loadSiteTitle() {
            const cacheKey = 'tgmusic_site_title';
            try {
                const cached = localStorage.getItem(cacheKey);
                if (cached) applySiteTitle(cached);
            } catch (e) {}
            fetch('/api/site', { cache: 'no-store' })
                .then((r) => (r.ok ? r.json() : null))
                .then((d) => {
                    if (!d || !d.title) return;
                    applySiteTitle(d.title);
                    try { localStorage.setItem(cacheKey, d.title); } catch (e) {}
                })
                .catch(() => {});
        })();

        let ap = null, db = [], lrcLines = [], currentTab = 'fav', tempMetaMap = new Map(), globalPlayingId = null;
        let modeIdx = 0, dbIndexMap = new Map(), lastVolume = 0.7, isMuted = false, currentAdminTab = 'all';
        let currentThemeIdx = -1, sleepEndTime = null, sleepTimerInt = null, isScrubbing = false, isDraggingVol = false;
        let lastActiveFileId = null, longPressTimer = null, initialTouchY = 0, currentDraggedEl = null, dragPlaceholder = null; 
        let libState = { songs: [], favorites: [], playlists: [], all_order: [] };
        let globalUploadQueue = [], uploadActiveWorkers = 0;
        // 息屏连播根治：单一 audio 元素 + 整曲 Blob 预载，杜绝第二个 audio 元素带来的电流声
        let nextBlob = null, warmingAbort = null, lastPositionSync = 0;
        // 切歌期间置锁，防止 listswitch 回调把 UI 刷成中间态。
        // 播音频的页面不受定时器深度节流，所以后台也能按时解锁。
        function releaseSwitchLock() {
            setTimeout(() => { isPlaylistSwitching = false; }, 200);
        }
        let renderCount = 20, pageSize = 20, isPlaylistSwitching = false, globalActiveListId = 'fav', favPending = new Set();
        let lastBackgroundUpdateId = null;

        const modes = ['list', 'single', 'random'];
        function placeholderCover() {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.32"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><rect x="0.5" y="0.5" width="99" height="99" fill="none" stroke="#ffffff" stroke-opacity="0.4"/><g fill="#ffffff" fill-opacity="0.85"><circle cx="36" cy="70" r="10"/><rect x="40" y="32" width="6" height="38"/><circle cx="66" cy="64" r="10"/><rect x="70" y="26" width="6" height="38"/><polygon points="40,32 76,26 76,35 40,41"/></g></svg>`;
            return 'data:image/svg+xml,' + encodeURIComponent(svg);
        }
        const solaraTheme = [
            { bg: '#f0fdf4', accent: '#10b981', deep: '#064e3b' },
            { bg: '#fff1f2', accent: '#fb7185', deep: '#881337' },
            { bg: '#f0f9ff', accent: '#0ea5e9', deep: '#0c4a6e' },
            { bg: '#faf5ff', accent: '#a855f7', deep: '#3b0764' },
            { bg: '#fdf4ff', accent: '#d946ef', deep: '#701a75' },
            { bg: '#fff7ed', accent: '#f97316', deep: '#7c2d12' },
            { bg: '#f8fafc', accent: '#64748b', deep: '#0f172a' },
            { bg: '#fdf2f8', accent: '#ec4899', deep: '#831843' },
            { bg: '#f0fdfa', accent: '#14b8a6', deep: '#134e4a' },
            { bg: '#fafaf9', accent: '#78716c', deep: '#292524' },
            { bg: '#eef2ff', accent: '#6366f1', deep: '#1e1b4b' },
            { bg: '#fffbeb', accent: '#d97706', deep: '#78350f' },
            { bg: '#f7fee7', accent: '#65a30d', deep: '#1a2e05' },
            { bg: '#020617', accent: '#38bdf8', deep: '#000000' },
            { bg: '#f5f3ff', accent: '#8b5cf6', deep: '#2e1065' },
            { bg: '#fff5f7', accent: '#f472b6', deep: '#831843' }
        ];

        // 把 #rrggbb 转成 rgba()，用于主题柔光。深色主题需要低透明度叠色才有层次。
        function hexToRgba(hex, alpha) {
            const h = String(hex || '').replace('#', '');
            const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
            const n = parseInt(full, 16);
            if (!isFinite(n) || full.length !== 6) return `rgba(255,255,255,${alpha})`;
            return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
        }

        function authKey() { try { return localStorage.getItem('sarah_key') || ''; } catch { return ''; } }
        function authHeaders() { return { 'X-Password': authKey() }; }
        function authStreamUrl(u) {
            if (!u || !u.startsWith('/api/stream')) return u;
            const k = authKey();
            return u + (u.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(k);
        }

        async function dbOp(action, data = {}) {
            try {
                const res = await fetch('/api/manage', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ action, data }) });
                const result = await res.json();
                if (!result.success) console.error("D1 Action Error:", result.error);
                return result;
            } catch (e) { console.error(e); return { success: false }; }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        const AUTH_EXPIRY_MS = 30 * 24 * 60 * 60 * 1000;

        function isAuthed() {
            try {
                const raw = localStorage.getItem('sarah_auth');
                if (!raw) return false;
                const { ts } = JSON.parse(raw);
                if ((Date.now() - ts) >= AUTH_EXPIRY_MS) return false;
                return !!localStorage.getItem('sarah_key');
            } catch { return false; }
        }

        let authPending = false;
        async function verifyAccess() {
            if (authPending) return;
            const input = document.getElementById('entry-pass');
            const btn = document.querySelector('.auth-btn');
            const pass = (input.value || '').trim();
            if (!pass) { showMsg("请输入密码"); input.focus(); return; }
            authPending = true;
            if (btn) { btn.disabled = true; btn.textContent = '验证中...'; }
            try {
                const res = await fetch('/api/check_auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });
                let data = null;
                try { data = await res.json(); } catch (e) { data = null; }
                if (data && data.success) {
                    try {
                        localStorage.setItem('sarah_auth', JSON.stringify({ ts: Date.now() }));
                        localStorage.setItem('sarah_key', pass);
                    } catch (e) {
                        showMsg("浏览器禁止保存登录状态，请关闭无痕模式后重试");
                        return;
                    }
                    const gate = document.getElementById('auth-gate');
                    gate.style.opacity = '0';
                    setTimeout(() => {
                        gate.style.display = 'none';
                        init(true).catch(() => showMsg("曲库加载失败，请刷新重试"));
                    }, 800);
                } else {
                    showMsg("密码错误");
                    input.value = '';
                    input.focus();
                }
            } catch (e) {
                showMsg("网络异常，请重试");
            } finally {
                authPending = false;
                if (btn) { btn.disabled = false; btn.textContent = '进入'; }
            }
        }

        function applyAuthTheme() {
            const t = solaraTheme[Math.floor(Math.random() * solaraTheme.length)];
            const gate = document.getElementById('auth-gate');
            gate.style.setProperty('--auth-bg', `linear-gradient(135deg, ${t.bg} 0%, ${t.deep} 100%)`);
            gate.style.setProperty('--auth-deep', t.deep);
            gate.style.setProperty('--auth-accent', t.accent);
            gate.style.setProperty('--auth-text', '#1e293b');
            gate.style.setProperty('--auth-text-muted', 'rgba(30,41,59,0.35)');
            gate.style.setProperty('--auth-accent-shadow', t.accent + '4d');
        }

        let isMobileLayout = window.innerWidth <= 768;
        function applyResponsiveLayout() {
            const nowMobile = window.innerWidth <= 768;
            const m = document.getElementById('main-ui');
            const p = document.getElementById('m-player');
            if (m) m.style.display = nowMobile ? 'none' : 'flex';
            if (p) p.style.display = nowMobile ? 'flex' : 'none';
            if (nowMobile !== isMobileLayout) {
                isMobileLayout = nowMobile;
                renderAllLists();
                if (currentThemeIdx >= 0) updateBackground(false);
            }
        }
        let responsiveResizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(responsiveResizeTimer);
            responsiveResizeTimer = setTimeout(applyResponsiveLayout, 150);
        });

        async function init(isForce = false) {
            if (!isAuthed()) {
                document.getElementById('auth-gate').style.display = 'flex';
                applyAuthTheme();
                return;
            }
            if (isForce) document.getElementById('auth-gate').style.display = 'none';

            // 加速响应1：优先开启视觉背景
            updateBackground(true);
            applyResponsiveLayout();

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) { }
                        });
                    });
                }).catch(() => {});
            }
            try {
                const res = await fetch('/api/songs', { headers: authHeaders() });
                if (res.status === 401) {
                    try { localStorage.removeItem('sarah_auth'); localStorage.removeItem('sarah_key'); } catch (e) {}
                    const gate = document.getElementById('auth-gate');
                    gate.style.opacity = '1';
                    gate.style.display = 'flex';
                    applyAuthTheme();
                    showMsg("登录状态已失效，请重新输入密码");
                    return;
                }
                const raw = await res.json();
                if (raw.error) {
                    const gate = document.getElementById('auth-gate');
                    gate.style.opacity = '1';
                    gate.style.display = 'flex';
                    applyAuthTheme();
                    showMsg("曲库加载失败：" + raw.error);
                    return;
                }
                libState = raw; db = libState.songs;
                buildIndexMap(); renderCustomTabs(); 
                setupPlayer(); 
                renderAllLists(); 
                // APlayer 会从 localStorage 恢复上次音量，UI 必须跟着它走，
                // 否则刷新后音量条显示 70%，实际却是上次调过的值。
                if (ap) lastVolume = ap.audio.muted ? lastVolume : ap.volume();
                // 恢复上次选的倍速。audio 元素换 src 不会重置 playbackRate，
                // 但页面重开是新的 audio，必须重新设置。
                try {
                    const sp = parseFloat(localStorage.getItem('sarah_speed'));
                    if (ap && isFinite(sp) && sp > 0) ap.audio.playbackRate = sp;
                } catch (e) {}
                updateUIModes(); updateVolUI(lastVolume); 
                window.addEventListener('keydown', (e) => {
                    const el = document.activeElement;
                    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
                    if (e.ctrlKey || e.metaKey || e.altKey) return;
                    // 有弹窗/设置面板开着时不要抢按键
                    const modal = document.querySelector('#admin-panel.active, #playlist-selector-modal:not(.hidden), #sarah-dialog:not(.hidden)');
                    if (modal) return;
                    switch (e.code) {
                        case 'Space': e.preventDefault(); handlePlayToggle(); break;
                        case 'ArrowRight': e.preventDefault(); ap && ap.seek(Math.min(ap.audio.duration || 0, ap.audio.currentTime + 5)); break;
                        case 'ArrowLeft': e.preventDefault(); ap && ap.seek(Math.max(0, ap.audio.currentTime - 5)); break;
                        case 'ArrowUp': e.preventDefault(); adjustVolume(0.05); break;
                        case 'ArrowDown': e.preventDefault(); adjustVolume(-0.05); break;
                        case 'KeyN': handleNext(); break;
                        case 'KeyB': handlePrev(); break;
                        case 'KeyM': toggleMute(); break;
                    }
                });
                
                // 移动端返回键优化：注入初始伪路由
                history.replaceState({stage:'main'}, '');
                window.onpopstate = (e) => {
                    const drawer = document.getElementById('m-drawer');
                    const admin = document.getElementById('admin-panel');
                    const selector = document.getElementById('playlist-selector-modal');
                    const dialog = document.getElementById('sarah-dialog');
                    
                    if (dialog && !dialog.classList.contains('hidden')) { closeSarahDialog(); return; }
                    if (selector && !selector.classList.contains('hidden')) { closePlaylistSelector(); return; }
                    if (admin && admin.classList.contains('active')) { toggleAdmin(false, true); return; }
                    if (drawer && drawer.classList.contains('active')) { toggleMobileDrawer(false, true); return; }
                };

                if (libState.favorites.length > 0) { 
                    const f = libState.favorites[Math.floor(Math.random() * libState.favorites.length)]; 
                    globalActiveListId = 'fav'; 
                    currentTab = 'fav';
                    const idxInList = ap.list.audios.findIndex(a => a.url.includes('file_id=' + f));
                    if (idxInList !== -1) { try { ap.list.switch(idxInList); } catch (e) {} }
                    refreshUIMetaAt(dbIndexMap.get(f)); 
                    updateHighlights(f, true); 
                }
                else if (libState.all_order.length > 0) refreshUIMetaAt(dbIndexMap.get(libState.all_order[0]));
                else if (db.length > 0) refreshUIMetaAt(0);
            } catch (e) { console.error(e); }
        }

        async function silentRefresh() {
            try {
            const res = await fetch('/api/songs', { headers: authHeaders() }); const raw = await res.json();
            if (raw.error) return;
            let curFid = null;
            if(ap && ap.list.audios[ap.list.index]) {
                curFid = new URL(ap.list.audios[ap.list.index].url, window.location.origin).searchParams.get('file_id');
            }
            libState = raw; db = libState.songs;
            buildIndexMap();
            if(ap) {
              // 必须走 rebuildPlayerList，不能直接赋值 ap.list.audios：
              // APlayer 的列表 DOM、randomOrder、listCurs 都挂在内部状态上，
              // 只换数组会让它们和队列脱节，之后切歌会抛 TypeError。
              const newList = buildTrackList(listIdsFor(globalActiveListId));
              const oldList = ap.list.audios;
              const changed = oldList.length !== newList.length ||
                oldList.some((a, i) => !newList[i] || a.url !== newList[i].url);
              // 队列没变就别动播放，单纯的元数据刷新不该打断音乐
              if (changed) rebuildPlayerList(newList, { keepAudio: !!curFid });
            }
            if(document.getElementById('admin-panel').classList.contains('active')) {
              renderAdminPlaylistTabs(); renderAdminSongList();
            }
          } catch (e) { console.error(e); }
        }

        function buildIndexMap() { dbIndexMap.clear(); for(let j = 0; j < db.length; j++) dbIndexMap.set(db[j].file_id, j); }
        
        let warmingFid = null;
        function fidFromUrl(u) {
            try { return new URLSearchParams((u || '').split('?')[1] || '').get('file_id'); } catch (e) { return null; }
        }

        // 当前曲目已经缓冲多少秒「还没听」的内容。跨 buffer 区间取命中当前播放位置的那段。
        function bufferedAhead() {
            const a = ap.audio;
            if (!a.buffered || !a.buffered.length) return 0;
            for (let i = 0; i < a.buffered.length; i++) {
                if (a.buffered.start(i) <= a.currentTime && a.currentTime <= a.buffered.end(i)) {
                    return a.buffered.end(i) - a.currentTime;
                }
            }
            return 0;
        }

        // 只有当「当前这首」缓冲已经够安全时才允许预载下一首。
        // 否则两首歌抢同一条带宽，当前这首反而被拖慢 —— 这正是之前"加载慢"的由来：
        // 旧逻辑在 play 事件里立刻整曲下载下一首，和正在听的这首硬抢。
        function preloadGateOpen() {
            const a = ap.audio;
            if (a.paused) return false;
            const ahead = bufferedAhead();
            const dur = a.duration || 0;
            if (ahead >= 12) return true;
            if (dur > 0 && ahead >= 5 && ahead / dur >= 0.15) return true;
            return false;
        }

        // 头部预热：只取开头一小段塞进浏览器 HTTP 缓存（服务端支持 Range）。
        // 这样真正切歌时首字节立刻可用，不用等首包往返。
        const HEAD_WARM_BYTES = 1.2 * 1024 * 1024;
        let headWarmedFid = null, preloadStartedFid = null;
        function warmHead(url, fid) {
            if (!url || !fid || headWarmedFid === fid) return;
            headWarmedFid = fid;
            fetch(url, {
                credentials: 'same-origin',
                headers: { Range: 'bytes=0-' + (HEAD_WARM_BYTES - 1) }
            }).then(r => { if (r && r.body) r.body.cancel(); }).catch(() => {});
        }

        function nextTrackInfo() {
            if (!ap || !ap.list || ap.list.audios.length <= 1) return null;
            if (ap.options.loop === 'one') return null;
            let nextIdx;
            try { nextIdx = ap.nextIndex(); } catch (e) { nextIdx = (ap.list.index + 1) % ap.list.audios.length; }
            const audio = ap.list.audios[nextIdx];
            if (!audio || !audio.url) return null;
            const fid = fidFromUrl(audio.url);
            return fid ? { fid, url: audio.url } : null;
        }

        // 按当前播放模式（列表/随机/单曲）取"下一首"，整曲下载成 Blob。
        // 切歌瞬间把 Blob URL 直接喂给唯一 audio 元素，无需联网即可无缝连播。
        // 全程只有一个 audio 元素，不会触发此前"隔几秒电流声"的多元素后台缓冲干扰。
        function preloadNextTrack() {
            if (!ap || !ap.list || ap.list.audios.length <= 1) return;
            if (ap.options.loop === 'one') return;
            const next = nextTrackInfo();
            if (!next) return;
            const nextFid = next.fid;
            if (nextBlob && nextBlob.fid === nextFid) return;
            if (warmingFid === nextFid) return;
            if (warmingAbort) warmingAbort.abort();
            warmingFid = nextFid;
            const controller = warmingAbort = new AbortController();
            fetch(next.url, { credentials: 'same-origin', signal: controller.signal })
                .then(async (res) => {
                    if (!res || !res.ok || !res.body) return;
                    const total = Number(res.headers.get('Content-Length') || 0);
                    if (total > 40 * 1024 * 1024) { res.body.cancel(); return; }
                    const blob = await res.blob();
                    if (warmingFid !== nextFid) return;
                    if (nextBlob) URL.revokeObjectURL(nextBlob.url);
                    nextBlob = { fid: nextFid, url: URL.createObjectURL(blob) };
                })
                .catch(() => {})
                .finally(() => { if (warmingFid === nextFid) { warmingFid = null; warmingAbort = null; } });
        }

        function listIdsFor(listId) {
            if (listId === 'all') return libState.all_order.length ? libState.all_order : db.map(s => s.file_id);
            if (listId === 'fav') return libState.favorites;
            return libState.playlists.find(p => p.id === listId)?.ids || [];
        }

        function buildTrackList(ids) {
            return ids.map(id => {
              const s = db[dbIndexMap.get(id)];
              if (!s) return null;
              return {
                name: s.title, artist: s.artist,
                cover: authStreamUrl(s.cover) || placeholderCover(),
                url: authStreamUrl('/api/stream?file_id=' + s.file_id),
                lrc: s.lrc || '[00:00.00]暂无歌词',
                type: 'normal'
              };
            }).filter(Boolean);
        }

        // 必须走 list.clear()/add() 重建：直接改 ap.list.audios 会让 APlayer 内部列表 DOM 与数组长度脱节，
        // 之后 switch() 越界抛错，表现为"点了歌没反应"。重建后还原当前曲目与播放进度。
        // 重建队列时 APlayer 会连着做三件打断播放的事：clear() 里 pause() 并清空
        // audio.src、add() 在空队列上自动 switch(0)、switch() 里 setAudio() 重新赋值
        // src 再 seek(0)。三者叠加就是把正在播的歌从第 0 字节重下一遍 —— 听感就是明显停顿。
        // 冻结期间这些写操作全部丢弃，音频元素保持原状继续播；列表 DOM 和内部数组
        // 仍由 APlayer 自己维护，不会和后续的上一首/下一首错位。
        // 遗留的播放进度记录，清掉用户设备上已有的数据
        try { localStorage.removeItem('sarah_positions'); } catch (e) {}

        // src / currentTime 的冻结由 ap 创建时装的持久守卫负责（见 setupPlayer），
        // 这里只切换标志位 + 挡住 pause。早先在这里临时替换描述符，
        // 但 finally 里的 delete 会把持久守卫一并删掉，反而让后续赋值绕过守卫。
        let isFreezingAudio = false;
        function freezeAudio(fn) {
            const audio = ap.audio;
            const origPause = audio.pause;
            audio.pause = function () {};
            isFreezingAudio = true;
            try { return fn(); }
            finally {
                isFreezingAudio = false;
                audio.pause = origPause;
            }
        }

        // keepAudio：当前曲目还在新队列里时是否保住不中断（冻结音频）。
        // deferSelect：调用方紧接着会自己 switch 到目标曲目，此时不要做中间切换，
        //   否则 add() 在空队列上自动 switch(0) 会白下载一次。
        // 两者必须分开：删除当前歌曲时既要重建队列（keepAudio=false），
        // 又需要 APlayer 选一首出来，否则播放器会卡在空状态。
        function rebuildPlayerList(trackList, { keepAudio = true, deferSelect = false } = {}) {
            const curAudio = ap.list.audios[ap.list.index];
            const curFid = curAudio ? fidFromUrl(curAudio.url) : null;
            const wasPlaying = !ap.audio.paused;
            const guard = isPlaylistSwitching;
            const newIdx = curFid ? trackList.findIndex(a => fidFromUrl(a.url) === curFid) : -1;
            isPlaylistSwitching = true;

            const apply = () => {
                ap.list.clear();
                if (!deferSelect) {
                    ap.list.add(trackList);
                    if (newIdx !== -1) ap.list.switch(newIdx);
                    return;
                }
                const origSwitch = ap.list.switch;
                ap.list.switch = () => {};
                try { ap.list.add(trackList); } finally { ap.list.switch = origSwitch; }
            };
            // 当前曲目还在新队列里 → 冻结音频，重建过程不碰真实播放
            if (newIdx !== -1 && keepAudio) freezeAudio(apply);
            else apply();

            if (newIdx !== -1 && keepAudio) {
                refreshUIMetaByAudio(trackList[newIdx]);
                // clear() 里的 pause() 会把 APlayer 的 UI 标记打成暂停，
                // 声音其实没停，这里把图标状态纠正回来。
                if (wasPlaying && ap.paused) ap.play();
                // setAudio 里被挡掉的 seek(0) 会把进度条和歌词重置到开头，
                // 这里立刻按真实播放位置校正，避免肉眼可见的闪一下。
                const cur = ap.audio.currentTime || 0;
                const dur = ap.audio.duration || 0;
                if (dur > 0) {
                    ap.bar.set('played', cur / dur, 'width');
                    ap.template.ptime.innerHTML = fmtTime(cur);
                    if (ap.lrc) ap.lrc.update(cur);
                }
            }
            if (!guard) releaseSwitchLock();
        }

        function setupPlayer() {
            const trackList = buildTrackList(listIdsFor(globalActiveListId));

            if (ap) {
                const currentTrackUrls = ap.list.audios.map(a => a.url);
                const newTrackUrls = trackList.map(a => a.url);
                if (JSON.stringify(currentTrackUrls) !== JSON.stringify(newTrackUrls)) rebuildPlayerList(trackList);
                return;
            }


            ap = new APlayer({ container: document.getElementById('ap-hidden'), lrcType: 1, audio: trackList, volume: lastVolume || 0.7 });

            // 移动端后台播放：audio 必须留在文档里且带 playsinline，否则 iOS/安卓息屏会挂起播放。
            // preload=auto 让浏览器尽早开始缓冲；不设 muted，避免被当成"静音自动播放"而降权。
            // APlayer 的 list.clear() 里有 `audio.src = ""`。空字符串会被浏览器
            // 解析成「当前页面 URL」，于是它拿 HTML 当音频去解码 —— 切歌瞬间爆一声
            // 电流杂音。只有需要重建队列时才会走到 clear()，所以是「偶发」。
            // 这里装一个持久守卫：空值直接丢弃，冻结期间也丢弃。
            const _srcDesc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'src');
            const _ctDesc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'currentTime');
            Object.defineProperty(ap.audio, 'src', {
                configurable: true,
                get() { return _srcDesc.get.call(ap.audio); },
                set(v) {
                    if (v === '' || v === null || v === undefined) return;
                    if (isFreezingAudio) return;
                    _srcDesc.set.call(ap.audio, v);
                }
            });
            Object.defineProperty(ap.audio, 'currentTime', {
                configurable: true,
                get() { return _ctDesc.get.call(ap.audio); },
                set(v) { if (!isFreezingAudio) _ctDesc.set.call(ap.audio, v); }
            });

            ap.audio.setAttribute('playsinline', '');
            ap.audio.setAttribute('webkit-playsinline', '');
            ap.audio.setAttribute('preload', 'auto');
            // APlayer 只 createElement 不 appendChild，音频元素游离在 DOM 外，移动端息屏即被挂起。
            // 挂进宿主后浏览器才把它当"页面媒体"处理，锁屏/切后台可继续播放。
            const _audioHost = document.getElementById('ap-hidden');
            if (_audioHost && ap.audio.parentNode !== _audioHost) _audioHost.appendChild(ap.audio);

            // 物理级根治点：拦截 APlayer 音频切换，若下一首已预载为 Blob，直接把 Blob URL 喂给唯一 audio 元素，
            // 息屏后不发起任何新网络请求即可无缝连播；全程仍只有一个 audio 元素，不会出现隔几秒电流声。
            const _origSetAudio = ap.setAudio.bind(ap);
            ap.setAudio = (audioObj) => {
                // 冻结期间音频并未真正切换，此时消耗预载 Blob 等于白丢一次缓冲
                if (isFreezingAudio) return _origSetAudio(audioObj);
                if (!audioObj || !audioObj.url || audioObj.url.startsWith('blob:')) {
                    return _origSetAudio(audioObj);
                }
                const fid = fidFromUrl(audioObj.url);
                if (nextBlob && fid && fid === nextBlob.fid) {
                    const httpUrl = audioObj.url;
                    const blobUrl = nextBlob.url;
                    nextBlob = null;
                    audioObj.url = blobUrl;
                    _origSetAudio(audioObj);
                    audioObj.url = httpUrl;
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
                    preloadNextTrack();
                    return;
                }
                _origSetAudio(audioObj);
            };
            
            ap.audio.addEventListener('progress', () => {
                const audio = ap.audio;
                if (audio.buffered.length > 0) {
                    const bufferedEnd = audio.buffered.end(audio.buffered.length - 1);
                    const duration = audio.duration;
                    if (duration > 0) {
                        const p = (bufferedEnd / duration) * 100 + "%";
                        ['prog-buffer', 'm-prog-buffer'].forEach(id => {
                            const el = document.getElementById(id);
                            if(el) el.style.width = p;
                        });
                    }
                }
            });

            ap.on('play', () => { 
                const s = '<rect x="7.1" y="4.4" width="3.6" height="15.2" rx="1.7"/><rect x="13.3" y="4.4" width="3.6" height="15.2" rx="1.7"/>'; 
                document.getElementById('p-icon').innerHTML = s; document.getElementById('m-p-icon').innerHTML = s; 
                // 唱片转圈不在这里启动：play 事件只代表「请求播放」，
                // 此时音频可能还在加载、读秒没动。改由 syncDiscSpin 依真实读秒驱动。
                const cur = ap.list.audios[ap.list.index];
                if (cur) {
                    const fid = new URL(cur.url, window.location.origin).searchParams.get('file_id');
                    if (fid && fid !== globalPlayingId) {
                        globalPlayingId = fid;
                        refreshUIMetaByAudio(cur);
                    }
                    if (fid !== lastBackgroundUpdateId) {
                        lastBackgroundUpdateId = fid;
                        // 性能权衡：切歌触发视觉更新
                        updateBackground(true);
                    }
                    updateHighlights(fid, false);
                }
                updateMediaSession();
                // 立刻只预热下一首的头部（1.2MB，抢不了多少带宽），
                // 整曲预载要等当前这首缓冲到安全水位才放行（见 preloadGateOpen）。
                const nxt = nextTrackInfo();
                if (nxt) { headWarmedFid = null; warmHead(nxt.url, nxt.fid); }
                preloadStartedFid = null;
            });

            ap.on('pause', () => { 
                const s = '<g transform="translate(-1.8 .95)"><path d="M8.4 4.9a1.35 1.35 0 0 1 2.06-1.15l10.1 6.15a1.35 1.35 0 0 1 0 2.3L10.46 18.35A1.35 1.35 0 0 1 8.4 17.2z"/></g>'; 
                document.getElementById('p-icon').innerHTML = s; document.getElementById('m-p-icon').innerHTML = s; 
                document.getElementById('m-disc-wrapper').classList.remove('playing');
                updateMediaSession();
            });

            ap.on('timeupdate', () => { 
                if (isScrubbing) return;
                const cur = ap.audio.currentTime, dur = ap.audio.duration || 0, p = (cur / (dur || 1) * 100) + '%';
                syncDiscSpin(cur);
                ['prog-bar', 'm-prog-bar'].forEach(id => { const el = document.getElementById(id); if(el) el.style.width = p; });
                ['cur-time', 'm-cur-time'].forEach(id => { const el = document.getElementById(id); if(el) el.innerText = fmtTime(cur); });
                ['total-time', 'm-total-time'].forEach(id => { const el = document.getElementById(id); if(el) el.innerText = fmtTime(dur); });
                
                // 根本解决：主动心跳采样。弥补自动连播时浏览器 progress 事件触发频率不稳定的缺陷。
                if (dur > 0 && ap.audio.buffered.length > 0) {
                    const bEnd = ap.audio.buffered.end(ap.audio.buffered.length - 1);
                    const bP = (bEnd / dur * 100) + "%";
                    ['prog-buffer', 'm-prog-buffer'].forEach(id => { const el = document.getElementById(id); if(el) el.style.width = bP; });
                }

                syncLyrics(cur);

                // 当前这首缓冲到安全水位后再预载下一首，避免两首歌抢带宽。
                // 每首只触发一次，之后由 preloadNextTrack 自己的去重逻辑兜住。
                if (preloadStartedFid !== globalPlayingId && preloadGateOpen()) {
                    const nxt = nextTrackInfo();
                    if (nxt && !(nextBlob && nextBlob.fid === nxt.fid)) {
                        preloadStartedFid = globalPlayingId;
                        preloadNextTrack();
                    }
                }

                // 锁屏进度条每秒同步一次即可，调太频繁会被浏览器限流
                const now = Date.now();
                if (now - lastPositionSync > 1000) { lastPositionSync = now; updatePositionState(); }
            });

            // 兜底：切后台/息屏时若尚未预载，立即补齐 Blob 预载（绝不创建第二个 audio 元素）
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && ap) {
                    // ap.paused 是 APlayer 自己维护的标记，息屏后可能和真实媒体状态不同步
                    if (!ap.audio.paused && ap.list.audios.length > 1) preloadNextTrack();
                }
            });
            // 安全网：APlayer 的 ended 自动切歌在部分移动浏览器息屏后会失效。
            // 这里只能用 setTimeout —— rAF 在息屏/后台会完全停止，兜底逻辑就永远不跑了。
            // 播音频的页面不受定时器深度节流，所以后台 setTimeout 仍然会正常触发。
            // 注意：APlayer 内置的 ended 处理在 loop=all 时会自己 skipForward()，
            // 这里再 handleNext() 就会一首结束连跳两首。所以先记下结束时的曲目，
            // 300ms 后只有"还停在同一首且真的没在播"才兜底。
            ap.audio.addEventListener('ended', () => {
                if (ap.options.loop === 'one') return;
                const endedFid = ap.list.audios[ap.list.index] ? fidFromUrl(ap.list.audios[ap.list.index].url) : null;
                setTimeout(() => {
                    if (!ap || !ap.audio.paused) return;
                    if (ap.list.audios.length < 2) return;
                    const nowFid = ap.list.audios[ap.list.index] ? fidFromUrl(ap.list.audios[ap.list.index].url) : null;
                    // 内置逻辑已经切走了，说明兜底不需要介入
                    if (endedFid && nowFid && endedFid !== nowFid) return;
                    handleNext();
                }, 300);
            });

            ap.on('listswitch', (data) => { 
                lastTickTime = -1;
                if (isPlaylistSwitching) return;
                const targetIdx = data.index !== undefined ? data.index : ap.list.index;
                const audio = ap.list.audios[targetIdx];
                if (audio) {
                    const fid = new URLSearchParams(audio.url.split('?')[1]).get('file_id');
                    if (fid && fid !== globalPlayingId) {
                      refreshUIMetaByAudio(audio);
                    }
                }
                ['prog-buffer', 'm-prog-buffer'].forEach(id => {
                    const el = document.getElementById(id);
                    if(el) el.style.width = "0%";
                });
            });
        }

        function updateMediaSession() { 
            const currentAudio = ap.list.audios[ap.list.index]; if (!('mediaSession' in navigator) || !currentAudio) return; 
            const fileId = new URLSearchParams(currentAudio.url.split('?')[1]).get('file_id'); 
            const song = db[dbIndexMap.get(fileId)] || { title: currentAudio.name, artist: currentAudio.artist, cover: currentAudio.cover };
            navigator.mediaSession.metadata = new MediaMetadata({ title: song.title, artist: song.artist, album: SITE_TITLE, artwork: [{ src: authStreamUrl(song.cover) || placeholderCover(), sizes: '512x512', type: 'image/svg+xml' }] }); 
            navigator.mediaSession.playbackState = ap.audio.paused ? 'paused' : 'playing';
            navigator.mediaSession.setActionHandler('play', () => handlePlayToggle());
            navigator.mediaSession.setActionHandler('pause', () => handlePlayToggle());
            navigator.mediaSession.setActionHandler('previoustrack', () => handlePrev());
            navigator.mediaSession.setActionHandler('nexttrack', () => handleNext());
            navigator.mediaSession.setActionHandler('seekto', (details) => { if (details.seekTime != null) ap.seek(details.seekTime); });
            navigator.mediaSession.setActionHandler('seekbackward', (d) => ap.seek(Math.max(0, ap.audio.currentTime - (d.seekOffset || 10))));
            navigator.mediaSession.setActionHandler('seekforward', (d) => ap.seek(Math.min(ap.audio.duration || 0, ap.audio.currentTime + (d.seekOffset || 10))));
            navigator.mediaSession.setActionHandler('stop', () => { ap.pause(); ap.seek(0); });
            updatePositionState();
        }

        // 锁屏/通知栏进度条：不设置的话安卓只显示"播放中"，没有可拖动进度
        function updatePositionState() {
            if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
            const d = ap && ap.audio.duration;
            if (!d || !isFinite(d) || d <= 0) return;
            try {
                navigator.mediaSession.setPositionState({
                    duration: d,

            if (!song.lrc) {
               // 核心优化：异步拉取歌词
               dbOp('get_lrc', { file_id: song.file_id }).then(res => {
                   if (res.success) {
                       song.lrc = res.lrc;
                       if (globalPlayingId === song.file_id) processLrc(song.lrc);
                   }

            } else processLrc(song.lrc);

            updateHighlights(song.file_id, false); 
        }

        function processLrc(rawLrc) {
            const pattern = /^\[(\d+):(\d+).(\d+)\](.*)/;
            lrcLines = (rawLrc || "").split(/\r?\n/).map(l => { const m = pattern.exec(l); return m ? { t: parseInt(m[1]) * 60 + parseInt(m[2]), text: m[4].trim() } : null; }).filter(v => v && v.text);
            const renderL = (id) => {
                const el = document.getElementById(id); if(!el) return;
                if (!lrcLines.length) { el.innerHTML = '<div class="lrc-line active !opacity-30">暂无歌词</div>'; el.classList.add('justify-center'); }
                else { el.classList.remove('justify-center'); el.innerHTML = '<div style="height:65px;flex-shrink:0;"></div>' + lrcLines.map((l, i) => `<div class="lrc-line" id="${id}-lrc-${i}" onclick="ap.seek(${l.t})">${escapeHtml(l.text)}</div>`).join('') + '<div style="height:65px;flex-shrink:0;"></div>'; }
            };
            renderL('lrc-view'); renderL('m-lrc-flow');
        }

        function syncLyrics(t) {
            if (!lrcLines.length) return;
            let active = -1; for (let i = 0; i < lrcLines.length; i++) if (t >= lrcLines[i].t) active = i;
            if (active !== -1) {
                ['lrc-view', 'm-lrc-flow'].forEach(id => {
                    const view = document.getElementById(id); if(!view) return;
                    view.querySelectorAll('.lrc-line').forEach((el, i) => el.classList.toggle('active', i === active));
                    const target = document.getElementById(id + '-lrc-' + active);
                    if (target) view.scrollTo({ top: target.offsetTop - (view.offsetHeight / 2) + (target.offsetHeight / 2), behavior: 'smooth' });
                });
            }
        }

        function locateCurrentSong() {
            if (window.innerWidth <= 768) return;
            if (!ap || !ap.list.audios.length) return;
            const cur = ap.list.audios[ap.list.index];
            if (!cur) return;
            const fid = new URL(cur.url, window.location.origin).searchParams.get('file_id');
            if (!fid) return;
            const container = document.getElementById('list-view');
            if (!container) return;
            const collect = (listId, withSearch) => {
                const ids = listIdsFor(listId);
                const q = withSearch ? document.getElementById('search-input').value.toLowerCase() : '';
                let listData = ids.map(id => db[dbIndexMap.get(id)]).filter(Boolean);
                if (q) listData = listData.filter(s => s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q));
                return listData;
            };
            if (!container.querySelector(`.song-item[data-id="${fid}"]`)) {
                let idx = collect(currentTab, true).findIndex(s => s.file_id === fid);
                // 正在预览别的歌单时找不到当前歌曲，直接跳回播放队列所属的歌单
                if (idx === -1 && currentTab !== globalActiveListId) {
                    currentTab = globalActiveListId;
                    renderAllLists();
                    idx = collect(currentTab, true).findIndex(s => s.file_id === fid);
                }
                if (idx !== -1) {
                    renderCount = Math.max(renderCount, idx + 1);
                    renderAllLists();
                }
            }
            updateHighlights(fid, true);
        }
