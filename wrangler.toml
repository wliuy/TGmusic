name = "tgmusic"
compatibility_date = "2024-09-23"

main = "./worker/index.js"

# 保留控制台里设的变量和密钥（PASSWORD / TG_Bot_Token / TG_Chat_ID）。
# 不写这行，部署时会把它们清空。
keep_vars = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# 换成你自己的 D1 数据库 ID，查询命令：npx wrangler d1 list
# 保持占位符直接部署会报错，这是预期行为。
[[d1_databases]]
binding = "DB"
database_name = "sarah-db"
database_id = "48ca5684-559f-45e3-ba7f-2f95e60cc7c5"
